<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mcp-cdp fixture</title>
<style>
  body { font: 14px/20px system-ui; margin: 0; padding: 24px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  main { padding: 12px; border: 1px solid #30363d; border-radius: 8px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; }
</style>
</head>
<body>
<h1>CDP 采集测试</h1>
<main id="app">
  <p class="lead">hello</p>
  <div class="row">
    <button id="btn-a">点我</button>
    <button id="btn-b">也会记一条 console</button>
  </div>
  <div class="row">
    <input id="kw" placeholder="搜索题目" />
    <p id="echo"></p>
  </div>
  <div class="row">
    <a id="to-json" href="/api/items">去 JSON 页</a>
    <a id="to-slow" href="/api/slow">慢接口</a>
  </div>
  <div class="row">
    <iframe id="cross" style="width:220px;height:70px;border:1px solid #30363d"></iframe>
  </div>
</main>
<script>
(async () => {
  console.log('boot', 'ok');
  console.info('这是 info');
  console.warn('这是 warn');
  console.error('boom', { code: 42, msg: 'bad' });

  document.getElementById('btn-a').addEventListener('click', () => {
    console.log('btn-a clicked');
  });

  // 给 interact 的 fill 用：模拟受控输入
  document.getElementById('kw').addEventListener('input', e => {
    document.getElementById('echo').textContent = 'kw=' + e.target.value;
  });

  const hit = (u, opt) => fetch(u, opt).catch(e => console.warn('fetch failed:', e.message));

  // 200 JSON
  await hit('/api/items');
  // POST，带 body —— 用来验证 postData 有没有被记下来
  await hit('/api/save', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ a: 1, b: 'two' })
  });
  // 500
  await hit('/api/fail');
  // 404
  await hit('/api/missing-thing');
  // 20000 字，应该落盘
  await hit('/api/big');
  // 慢请求
  await hit('/api/slow');
  // 连接失败
  await hit('http://127.0.0.1:1/nope');

  setTimeout(() => { throw new Error('未捕获的异常'); }, 60);
  setTimeout(() => console.log('tick'), 150);

  // 跨域 iframe：换 host 制造不同 origin，用来测子会话
  const ifr = document.getElementById('cross');
  ifr.src = 'http://localhost:' + location.port + '/inner.html';

  // WebSocket：用来测帧采集
  try {
    const ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen = () => ws.send('hello-from-page');
    ws.onmessage = e => console.log('ws-echo:' + e.data);
  } catch (e) {
    console.log('ws 初始化失败', e.message);
  }
})();
</script>
</body>
</html>
